name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine previous successful submission
        id: base
        run: |
          git fetch origin refs/tags/indexnow-last-submitted:refs/tags/indexnow-last-submitted || true
          previous="$(git rev-list -n 1 refs/tags/indexnow-last-submitted 2>/dev/null || true)"
          if [ -n "$previous" ] && git merge-base --is-ancestor "$previous" "$GITHUB_SHA"; then
            echo "sha=$previous" >> "$GITHUB_OUTPUT"
          else
            echo "sha=0000000000000000000000000000000000000000" >> "$GITHUB_OUTPUT"
          fi
      - name: Notify IndexNow
        env:
          INDEXNOW_SITE_URL: https://ai-flywheel-spec.infoconex.com
          INDEXNOW_KEY: c75c60a5016c4f178e3f1404d43946d8
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/indexnow.py
      - name: Record successful notification
        run: |
          git tag -f indexnow-last-submitted "$GITHUB_SHA"
          git push --force origin refs/tags/indexnow-last-submitted
