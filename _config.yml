title: Infoconex AI Flywheel
description: An evidence-driven operating model for AI systems that learn from execution and improve how work is performed.
url: https://infoconex.github.io
baseurl: /ai-flywheel-spec
repository: infoconex/ai-flywheel
asset_version: "20260723-1"

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock

plugins:
  - jekyll-seo-tag
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

# Apply the site layout to existing Markdown without adding frontmatter to every page.
defaults:
  - scope:
      path: ""
    values:
      layout: default
